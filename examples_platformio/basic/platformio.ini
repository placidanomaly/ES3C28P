[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 16MB Flash + 8MB Octal PSRAM (N16R8) & USB CDC serial over TYPE-C
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

build_flags =
  ; USB Type-C Serial support
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; We're fine with the default lv_conf.h from LVGL 9.6. REMOVE THIS LINE
  ; if you want to customize LVGL by including a custom lv_conf.h header
  ; in the compilation
  -D LV_CONF_SKIP
  ; TFT_eSPI hardware configuration
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=13
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=46
  -D TFT_RST=-1
  -D TFT_BL=45
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_INVERSION_ON=1
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=16000000
  ; Optional: uncomment if drawing text directly via TFT_eSPI instead of LVGL
  ; -D LOAD_GLCD=1
  ; -D LOAD_FONT2=1

; Uncomment for the example program to use the locally installed library instead
; of pulling it from the repo. If you do that, comment out the library in lib_deps
;lib_extra_dirs = ../../..

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^9.6.0
    https://github.com/placidanomaly/ES3C28P ; Comment out if lib_extra_dirs is defined
